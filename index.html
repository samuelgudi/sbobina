<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sbobina</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f4ee; --ink: #1d2125; --muted: #5d6670; --accent: #1f7a6b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14171a; --ink: #e8eaec; --muted: #9aa3ad; --accent: #4fb8a5; } }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    main { max-width: 32rem; margin: 15vh auto 0; padding: 0 16px; }
    p { color: var(--muted); }
    button { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Published from the public repository samuelgudi/sbobina on GitHub Pages: it keeps the old short link
       working and sends the visitor to the app on its server, keeping the part after "#" (the access key of an
       access link, which browsers never send to any server). Nothing secret belongs in this file. -->
  <main>
    <h1 id="title">Sbobina</h1>
    <p id="text">Apro l'app…</p>
    <button id="retry" hidden>Riprova</button>
  </main>
  <script>
    const APP = "https://sbobina.tail631e49.ts.net/";
    const WAIT_MS = 6000;

    async function go() {
      document.getElementById("retry").hidden = true;
      document.getElementById("title").textContent = "Sbobina";
      document.getElementById("text").textContent = "Apro l'app…";
      try {
        const response = await fetch(APP + "api/health", { cache: "no-store", signal: AbortSignal.timeout(WAIT_MS) });
        if (!response.ok) throw new Error(String(response.status));
        location.replace(APP + location.hash);
      } catch {
        document.getElementById("title").textContent = "Servizio fermo";
        document.getElementById("text").textContent =
          "Sbobina non risponde in questo momento. Non hai sbagliato nulla: il servizio è temporaneamente fermo, riprova più tardi.";
        document.getElementById("retry").hidden = false;
      }
    }

    // Version 1 of the app ran at this address with a service worker: it goes, so no old copy is ever shown.
    navigator.serviceWorker?.getRegistrations().then((all) => all.forEach((r) => r.unregister())).catch(() => {});
    document.getElementById("retry").addEventListener("click", go);
    go();
  </script>
</body>
</html>
